name: build-and-deploy

on:
  # 每天 07:25 UTC（夏令时 09:25 CEST），排在早间论文/新闻自动任务之后，抓到当天最新内容
  schedule:
    - cron: "25 7 * * *"
  # 手动触发
  workflow_dispatch:
  # 改了 build.py / 模板后推上来即重建
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
